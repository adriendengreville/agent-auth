name: SSH integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:bookworm-slim', 'debian:trixie-slim', 'ubuntu:24.04', 'alpine:3.22']
    steps:
      - uses: actions/checkout@v4
      - name: Test service failure recovery
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test actual SSH authentication
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" "$IMAGE" sh -c '
            if command -v apk >/dev/null; then
              apk add --no-cache openssh-server-pam google-authenticator libqrencode-tools python3 shadow linux-pam py3-paramiko py3-pexpect
            else
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y python3-paramiko python3-pexpect openssh-server
            fi
            AGENT_AUTH_DISPOSABLE=yes python3 -u /src/tests/integration.py
          '
  systemd-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test SSH daemon
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Exercise a real failed reload and listener recovery
        run: sudo env AGENT_AUTH_DISPOSABLE=yes python3 tests/systemd_recovery.py
      - name: Full installation and authentication under systemd
        run: |
          sudo apt-get install -y python3-paramiko python3-pexpect
          sudo ln -s "$PWD" /src
          sudo env AGENT_AUTH_DISPOSABLE=yes AGENT_AUTH_SYSTEMD=yes python3 -u tests/integration.py
